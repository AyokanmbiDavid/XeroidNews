<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidNews | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fd; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .skeleton { background: linear-gradient(90deg, #ececec 25%, #f5f5f5 50%, #ececec 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
        @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="pb-28">
    <div id="sidebarOverlay" onclick="window.toggleMenu()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-[60] hidden"></div>
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 glass z-[70] p-8 -translate-x-full transition-transform duration-300">
        <h2 class="font-bold text-xl text-indigo-600 mb-8">Categories</h2>
        <div class="space-y-2">
            <button onclick="window.fetchByCategory('technology')" class="w-full text-left p-3 rounded-2xl hover:bg-indigo-50 flex items-center gap-3"><span class="material-symbols-outlined">devices</span> Technology</button>
            <button onclick="window.fetchByCategory('business')" class="w-full text-left p-3 rounded-2xl hover:bg-indigo-50 flex items-center gap-3"><span class="material-symbols-outlined">trending_up</span> Business</button>
            <button onclick="window.fetchByCategory('sports')" class="w-full text-left p-3 rounded-2xl hover:bg-indigo-50 flex items-center gap-3"><span class="material-symbols-outlined">sports_esports</span> Sports</button>
        </div>
        <div class="mt-8">
            <p class="text-xs font-bold text-slate-400 mb-4 uppercase">Language</p>
            <select id="langSelect" onchange="window.changeLang()" class="w-full p-3 glass rounded-xl outline-none">
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
            </select>
        </div>
    </aside>

    <header class="p-6 flex justify-between items-center max-w-xl mx-auto sticky top-0 bg-[#f8f9fd]/90 backdrop-blur-md z-40">
        <div class="bg-indigo-600 text-white px-4 py-2 rounded-2xl flex items-center gap-2 shadow-lg font-bold text-sm">
            <span class="material-symbols-outlined">newspaper</span> XeroidNews
        </div>
        <div class="flex gap-3">
            <a href="wishlist.html" class="w-12 h-12 rounded-full glass flex items-center justify-center relative">
                <span class="material-symbols-outlined">bookmarks</span>
                <span id="wishlistCount" class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-600 text-white text-[10px] rounded-full flex items-center justify-center hidden">0</span>
            </a>
            <button onclick="window.toggleMenu()" class="w-12 h-12 rounded-full glass flex items-center justify-center"><span class="material-symbols-outlined">menu</span></button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6">
        <div class="glass w-full rounded-3xl p-2 flex items-center mb-8">
            <input type="text" id="newsQuery" placeholder="Search trends..." class="bg-transparent w-full px-5 outline-none text-sm">
            <button onclick="window.searchNews()" class="text-indigo-600 p-2"><span class="material-symbols-outlined">search</span></button>
        </div>
        <h2 id="viewTitle" class="text-xl font-bold mb-6 text-slate-800">Trending Now</h2>
        <div id="newsGrid" class="space-y-10"></div>
        <button id="loadMoreBtn" onclick="window.loadMore()" class="w-full py-4 mt-8 glass rounded-3xl font-bold text-indigo-600">Load More</button>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass h-20 flex items-center justify-around px-8 rounded-t-[40px] z-50">
        <a href="index.html" class="text-indigo-600"><span class="material-symbols-outlined text-3xl">home</span></a>
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-full -mt-12 border-8 border-[#f8f9fd] flex items-center justify-center shadow-xl"><span class="material-symbols-outlined text-3xl">explore</span></div>
        <a href="wishlist.html" class="text-slate-400"><span class="material-symbols-outlined text-3xl">favorite</span></a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
