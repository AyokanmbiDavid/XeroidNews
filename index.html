<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidNews | Intel Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pb-36 min-h-screen bg-[#121316] text-[#e3e2e6] selection:bg-[#004a77] selection:text-[#c2e7ff]">

    <!-- Material 3 Toast / Snackbar -->
    <div id="snackbar" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 min-w-[280px] bg-[#2e3036] text-[#e3e2e6] rounded-2xl p-4 hidden flex items-center gap-3 border border-white/10 shadow-2xl">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Notification message</span>
    </div>

    <!-- Navigation Drawer Overlay -->
    <div id="sidebarOverlay" onclick="window.toggleMenu()" class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm"></div>
    
    <!-- Sidebar / Drawer -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-80 bg-[#1e1f23] z-[70] p-6 -translate-x-full transition-transform duration-300 ease-in-out rounded-r-[32px] border-r border-white/10">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-[#004a77] text-[#c2e7ff] rounded-2xl flex items-center justify-center border border-white/10 shadow-md">
                <span class="material-symbols-rounded">newspaper</span>
            </div>
            <span class="font-bold text-white text-lg tracking-tight">Xeroid Intelligence</span>
        </div>
        
        <div class="space-y-2">
            <button onclick="window.fetchByCategory('technology')" class="w-full text-left py-3.5 px-5 rounded-2xl hover:bg-[#28292e] text-[#c4c6d0] hover:text-white flex items-center gap-4 text-xs font-bold transition-all">
                <span class="material-symbols-rounded text-base text-[#a8c7fa]">devices</span> Technology
            </button>
            <button onclick="window.fetchByCategory('business')" class="w-full text-left py-3.5 px-5 rounded-2xl hover:bg-[#28292e] text-[#c4c6d0] hover:text-white flex items-center gap-4 text-xs font-bold transition-all">
                <span class="material-symbols-rounded text-base text-[#a8c7fa]">trending_up</span> Business
            </button>
            <button onclick="window.fetchByCategory('sports')" class="w-full text-left py-3.5 px-5 rounded-2xl hover:bg-[#28292e] text-[#c4c6d0] hover:text-white flex items-center gap-4 text-xs font-bold transition-all">
                <span class="material-symbols-rounded text-base text-[#a8c7fa]">sports_baseball</span> Sports
            </button>
        </div>
    </aside>

    <!-- App Header & Search Bar -->
    <header class="p-4 sm:p-6 sticky top-0 bg-[#121316]/85 backdrop-blur-2xl z-40 border-b border-white/5">
        <div class="max-w-7xl mx-auto space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.toggleMenu()" class="w-10 h-10 rounded-full bg-[#1e1f23] text-[#e3e2e6] flex items-center justify-center border border-white/5 hover:bg-[#28292e] active:scale-90 transition-all shadow-sm">
                        <span class="material-symbols-rounded">menu</span>
                    </button>
                    <div>
                        <h1 id="viewTitle" class="text-lg font-bold tracking-tight text-white leading-none">Xeroid</h1>
                        <span class="text-[10px] text-[#a8c7fa] font-semibold tracking-wider uppercase">Intelligence Feed</span>
                    </div>
                </div>

                <a href="wishlist.html" class="w-10 h-10 rounded-full bg-[#1e1f23] text-[#e3e2e6] flex items-center justify-center border border-white/5 hover:bg-[#28292e] active:scale-90 transition-all shadow-sm relative">
                    <span class="material-symbols-rounded text-lg">bookmarks</span>
                    <span id="wishlistCount" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden border-2 border-[#121316]">0</span>
                </a>
            </div>

            <!-- Search Input -->
            <div class="flex items-center px-4 py-3 gap-3 max-w-2xl mx-auto bg-[#1e1f23] border border-white/10 rounded-full shadow-inner focus-within:border-[#a8c7fa] transition-all">
                <span class="material-symbols-rounded text-[#8e919e]">search</span>
                <input type="text" id="newsQuery" onkeyup="if(event.key==='Enter') window.searchNews()" placeholder="Search intelligence stories..." class="bg-transparent w-full outline-none text-xs font-medium text-white placeholder-[#8e919e]">
            </div>
        </div>
    </header>

   <!-- Main Grid Content Stream -->
<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

    <!-- Floating Navigation Bar (Android 14 Dock) -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-[#1e1f23]/90 backdrop-blur-2xl border border-white/10 p-2.5 rounded-full flex justify-around items-center z-50 shadow-2xl">
        <a href="index.html" class="flex flex-col items-center group">
            <div class="bg-[#004a77] text-[#c2e7ff] px-5 py-1.5 rounded-full transition-all group-active:scale-90">
                <span class="material-symbols-rounded text-sm" style="font-variation-settings: 'FILL' 1">home</span>
            </div>
            <span class="text-[10px] font-bold mt-1 text-[#a8c7fa]">Home</span>
        </a>
        <a href="wishlist.html" class="flex flex-col items-center group text-[#8e919e] hover:text-white transition-colors">
            <div class="px-5 py-1.5 rounded-full group-active:scale-90">
                <span class="material-symbols-rounded text-sm">favorite</span>
            </div>
            <span class="text-[10px] font-bold mt-1">Saved</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
