<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidNews | Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fd; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-28">
    <header class="p-6 max-w-xl mx-auto flex items-center justify-between sticky top-0 bg-[#f8f9fd]/90 backdrop-blur-md z-40">
        <button onclick="history.back()" class="flex items-center gap-2 text-slate-500 font-bold"><span class="material-symbols-outlined">arrow_back</span> Back</button>
        <button onclick="window.shareNews()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-indigo-600"><span class="material-symbols-outlined text-sm">share</span></button>
    </header>
        <main id="detailsContent" class="max-w-xl mx-auto px-6">
        <div id="loadingState" class="py-20 text-center opacity-50">
            <div class="skeleton w-full h-80 rounded-[45px] mb-6"></div>
            <p>Loading story details...</p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Force the render specifically for this page
        window.onload = () => {
            if (typeof window.renderDetailsPage === 'function') {
                window.renderDetailsPage();
            } else {
                console.error("renderDetailsPage function not found in script.js");
            }
        };
    </script>

    <script src="script.js"></script>
</body>
</html>
