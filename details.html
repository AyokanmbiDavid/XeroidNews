<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidNews | Intel Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#121316] text-[#e3e2e6] min-h-screen selection:bg-[#004a77] selection:text-[#c2e7ff] pb-28">

    <div id="snackbar" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 min-w-[280px] bg-[#2e3036] text-[#e3e2e6] rounded-2xl p-4 hidden flex items-center gap-3 border border-white/10 shadow-2xl">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Notification message</span>
    </div>

    <header class="p-4 sm:p-6 sticky top-0 bg-[#121316]/85 backdrop-blur-2xl z-40 border-b border-white/5">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-[#1e1f23] text-[#e3e2e6] flex items-center justify-center border border-white/5 hover:bg-[#28292e] active:scale-90 transition-all shadow-md">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>

            <span class="text-xs font-bold uppercase tracking-widest text-[#a8c7fa]">Intelligence Brief</span>

            <button onclick="window.shareNews()" class="w-10 h-10 rounded-full bg-[#1e1f23] text-[#e3e2e6] flex items-center justify-center border border-white/5 hover:bg-[#28292e] active:scale-90 transition-all shadow-md">
                <span class="material-symbols-rounded text-sm">share</span>
            </button>
        </div>
    </header>

    <main id="detailsContent" class="max-w-2xl mx-auto p-4 sm:p-6"></main>

    <script src="script.js"></script>
</body>
</html>
